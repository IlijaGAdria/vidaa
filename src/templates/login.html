

<div style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-image: url('../public/assets/background-login.png'); background-size: cover; background-repeat: no-repeat; background-position: center; z-index: -1;"></div>

<div class="login" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 15px; align-items: center; background: transparent; padding: 40px; border-radius: 8px; z-index: 1;">
  <input id="username" placeholder="Phone number or Username" style="padding: 10px; width: 250px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
  <input id="password" type="password" placeholder="Password" style="padding: 10px; width: 250px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
  <button id="loginBtn" style="padding: 10px; width: 250px; background-color: hsl(268, 100%, 11%); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; box-sizing: border-box;">Confirm</button>
</div>
