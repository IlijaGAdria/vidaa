
<!-- Login Background -->
<div style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-image: url('../public/assets/background-login.png'); background-size: cover; background-repeat: no-repeat; background-position: center; z-index: -1;"></div>

<header style="position: fixed; top: 0; left: 0; width: 100%; height: 80px; background-color: transparent; display: flex; align-items: center; padding-left: 20px; padding-right: 20px; justify-content: space-between; z-index: 10;">
  <img src="assets/logo.png" alt="Logo" style="height: 60px; width: auto; margin-top: 40px; margin-left: 20px;">

  <div class="date-box" style="display: flex; flex-direction: column; align-items: flex-end; margin-top: 40px; margin-right: 20px;"> 
    <div id="time" style="color: white; font-size: 18px; font-weight: 500;"></div>
    <div id="date" style="color: white; font-size: 18px; font-weight: 500;"></div>
  </div>

</header>

<img id="weatherIcon" />

<div style="display: grid; grid-template-columns: 1fr auto;">

<!-- Left Section -->
<div style="border: 1px solid white; max-width: 38%;">
  <div style="display: flex; align-items: center; gap: 16px;">
    <!-- <img src="assets/icon-mobile.png" alt="Mobile Icon" style="position: fixed; top: 50%; left: 20px; transform: translateY(-50%); width: 40px; height: auto; z-index: 1;"> -->
    <img style="height: 6.6vw; width: auto;" src="assets/icon-mobile.png" alt="Mobile Icon" >
    <h1 style="color: white; font-size: 2.4vw;" >Register with mobile phone</h1>
  </div>
  <div style="background-color: white; border: 1px solid white; display: block; width: 10vw; height: 10vw; margin: 0 auto;"></div>
  <p style="color: white; font-size: 2vw;">Scan the QR code to access the registration website via your mobile phone or type the url into the browser</p>
</div>

<!-- Right Section -->
<div style="border: 1px solid white; max-width: 100%; margin-right: 10%;">
  <div style="display: flex; align-items: center; gap: 16px;">
    <img style="height: 6.6vw; width: auto;" src="assets/icon-customer.png" alt="Mobile Icon" >
    <h1 style="color: white; font-size: 2.4vw; margin-left: 4vw;" >Customer center</h1>

  </div>

  <div style="display: flex; justify-content: space-between; height: 4vw;">

      <div style="width: 4vw; border: 1px solid white;"></div>
      <p style="color: white; font-size: 1.6vw;">Austria</p>
      <p style="color: white; font-size: 1.6vw;">+43 720 022 706</p>

   </div>

   <div style="display: flex; justify-content: space-between; height: 4vw;">

      <div style="width: 4vw; border: 1px solid white;"></div>
      <p style="color: white; font-size: 1.6vw;">Austria</p>
      <p style="color: white; font-size: 1.6vw;">+43 720 022 478</p>

   </div>

   <div style="display: flex; justify-content: space-between; height: 4vw;">

      <div style="width: 4vw; border: 1px solid white;"></div>
      <p style="color: white; font-size: 1.6vw;">Germany</p>
      <p style="color: white; font-size: 1.6vw;">+49 8937040018</p>

   </div>

   <div style="display: flex; justify-content: space-between; height: 4vw;">

      <div style="width: 4vw; border: 1px solid white;"></div>
      <p style="color: white; font-size: 1.6vw;">Sweden</p>
      <p style="color: white; font-size: 1.6vw;">+46 850780146</p>

   </div>

</div>

</div>

<div class="login" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 15px; align-items: center; background: transparent; padding: 40px; border-radius: 8px; z-index: 1;">
  <h1 style="color: white; font-size: 28px; margin: 0 0 20px 0; font-weight: 600;">Sign In</h1>
  <input id="username" placeholder="Phone number or Username" style="padding: 10px; width: 250px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
  <input id="password" type="password" placeholder="Password" style="padding: 10px; width: 250px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
  <button id="loginBtn" style="padding: 10px; width: 250px; background-color: hsl(268, 100%, 11%); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; box-sizing: border-box;">Confirm</button>
</div>
